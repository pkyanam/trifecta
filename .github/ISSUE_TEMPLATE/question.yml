name: Question
description: Ask a question about the project
title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Have a question about Trifecta? Please check if your question has already been answered in existing issues or documentation.

        For quick questions, you can also email us at info@belweave.com

  - type: textarea
    id: question
    attributes:
      label: Your question
      description: Please ask your question clearly and concisely
      placeholder: What would you like to know?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Provide any relevant context about your question
      placeholder: What are you trying to do? What have you already tried?

  - type: dropdown
    id: component
    attributes:
      label: Related component
      description: Which component is your question about?
      options:
        - trifecta-desktop
        - trifecta-mobile
        - trifecta-www
        - General / Architecture
        - Other
    validations:
      required: true
